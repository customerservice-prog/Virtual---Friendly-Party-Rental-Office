name: Office checks
on:
  push:
    branches: [main, showroom-frontend, showroom-controls, showroom-polish, apprenticeship, owner-command-center]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0 Pillow==11.3.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: python tests/showroom-ui.py
      - run: python tests/showroom-controls-ui.py
      - run: python tests/showroom-layout-ui.py
      - run: python tests/apprentice-ui.py
      - run: python tests/command-center-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showroom-browser-evidence
          path: test-results/
          retention-days: 7
